# Configuración de Netlify: la web es estática y los datos los guarda la función netlify/functions/api.mjs
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
