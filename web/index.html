<body>
<div id="app"></div>
<script src="boletines.js"></script>
<script src="legales.js"></script>
<script src="boletin.js"></script>
<script>
  /* Navegación sin cambiar la dirección: la barra muestra siempre solo la dirección del boletín.
     Los enlaces que llegan con #/... (por ejemplo, el de un colaborador) se abren y la dirección se limpia. */
  const CFG = window.PATRIAM_CONFIG || {};
  const TITULOS = { noticias: "Actualidad", historia: "Historia", sociedad: "Sociedad", podcasts: "Podcasts y vídeos", libros: "Libros", analisis: "Análisis", editoriales: "Editorial", editorial: "Editorial", colaboraciones: "Colaboraciones", colaboracion: "Colaboraciones", iniciativas: "Iniciativas", boletines: "Boletines anteriores", buscar: "Buscar", legal: "Textos legales", suscribirse: "Suscríbete", al: "Al momento", baja: "Darse de baja" };
  /* Cada boletín tiene su dirección: /boletin/2. El resto de páginas se ven sin cambiar la dirección. */
  const LISTA = (window.BOLETINES || []).filter(b => !b.estado || b.estado === "aprobado");
  function direccionDe(r) {
    const m = r.match(/^#\/boletin\/([^/]+)/);
    const b = m && LISTA.find(x => x.id === decodeURIComponent(m[1]) || String(x.numero) === decodeURIComponent(m[1]));
    if (b) return "/boletin/" + encodeURIComponent(b.numero);
    const a = r.match(/^#\/al\/([^/]+)/), am = a && ((CFG.alMomento) || []).find(x => x.id === decodeURIComponent(a[1]) || x.slug === decodeURIComponent(a[1]));
    return am && am.slug ? "/a/" + encodeURIComponent(am.slug) : "/";
  }
  /* ---------- estadísticas (sin cookies): visitas, clics y compartidos ----------
     Cada visita tiene un código; lo que comparte esta persona lo lleva (?c=…) y así se ve cuánta gente entra por cada reenvío. */
  const PARAM = new URLSearchParams(location.search);
  const CODIGO = Math.random().toString(36).slice(2, 10).padEnd(8, "0");
  window.__codigoLector = CODIGO;
  let primera = true;
  function medir(ev) {
    try {
      const b = JSON.stringify(Object.assign({ cod: CODIGO }, ev));
      if (navigator.sendBeacon) navigator.sendBeacon("/est.php", new Blob([b], { type: "text/plain" }));
      else fetch("/est.php", { method: "POST", body: b, keepalive: true });
    } catch (e) {}
  }
  let ruta = "#/";
  const viejo = new URLSearchParams(location.search).get("n");
  const porDireccion = location.pathname.match(/^\/boletin\/([^/]+)/), porMomento = location.pathname.match(/^\/a\/([^/.]+)/);
  if (location.hash.startsWith("#/")) ruta = location.hash;
  else if (porDireccion) ruta = "#/boletin/" + porDireccion[1];
  else if (porMomento) {   // la editorial o la firma invitada compartidas desde «Al momento» se abren completas
    const am = (CFG.alMomento || []).find(x => x.estado === "aprobado" && (x.slug === decodeURIComponent(porMomento[1]) || x.id === decodeURIComponent(porMomento[1])));
    ruta = am && /^#\/(editorial|colaboracion)\//.test(am.destino || "") ? am.destino : "#/al/" + porMomento[1];
  }
  else if (viejo) ruta = "#/boletin/" + encodeURIComponent(viejo);
  history.replaceState({ ruta }, "", direccionDe(ruta));

  function pintar(r, arriba) {
    ruta = r || "#/";
    medir(primera ? { t: "visita", r: ruta, e: 1, c: PARAM.get("c") || "", p: PARAM.get("p") || "", ref: document.referrer || "" } : { t: "visita", r: ruta });
    primera = false;
    document.getElementById("app").innerHTML = renderApp(ruta, LISTA, CFG);
    const sec = ruta.slice(2).split("/")[0];
    document.title = (CFG.cabecera || "Lo que hay que saber") + (TITULOS[sec] ? " · " + TITULOS[sec] : " · Boletín de PATRIAM");
    const caja = document.querySelector(".bol-buscar input");
    if (caja && sec === "buscar") caja.value = decodeURIComponent(ruta.split("/")[2] || "");
    if (arriba !== false) {
      const c = document.getElementById("centro"), menu = document.querySelector(".bol-menu");
      const y = ruta === "#/" || !c ? 0 : Math.max(0, c.getBoundingClientRect().top + window.scrollY - (menu ? menu.offsetHeight : 0) - 16);
      window.scrollTo(0, y);
    }
  }
  function ir(r) { if (r === ruta) { window.scrollTo({ top: 0, behavior: "smooth" }); return; } history.pushState({ ruta: r }, "", direccionDe(r)); pintar(r); }

  // Lo que se abre va a una pestaña nueva, con «Volver al boletín semanal» arriba y abajo.
  // «Boletín semanal» y «Volver al boletín» vuelven a la portada en la misma pestaña.
  function abrirNueva(destino) {
    const a = document.createElement("a");
    a.href = location.origin + "/" + destino; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }
  // Clics en enlaces de fuera (noticias, vídeos, podcasts…) y en los botones de compartir
  const RED = { wa: "whatsapp", xx: "x", fb: "facebook", ig: "instagram", en: "enlace" };
  document.addEventListener("click", e => {
    const comp = e.target.closest(".bol-comp");
    if (comp) { const k = Object.keys(RED).find(c => comp.classList.contains(c)); medir({ t: "compartir", r: ruta, red: RED[k] || "otro" }); return; }
    const a = e.target.closest("a[href]");
    if (!a) return;
    const h = a.getAttribute("href") || "";
    if (/^https?:/i.test(h) && !h.startsWith(location.origin)) medir({ t: "clic", r: ruta, d: a.href, l: (a.getAttribute("aria-label") || a.textContent || "").replace(/\s+/g, " ").trim().slice(0, 120) });
  }, true);
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#/']");
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    const destino = a.getAttribute("href");
    // Portada y boletines: en la misma pestaña (cada boletín con su propia dirección para compartirla)
    if (destino === "#/" || destino === "#/boletines" || destino.startsWith("#/boletin/")) ir(destino); else abrirNueva(destino);
  });
  window.buscarDesde = input => { const q = input.value.trim(); if (q) { abrirNueva("#/buscar/" + encodeURIComponent(q)); input.value = ""; } return false; };
  // Botón "atrás" del móvil o del navegador
  window.addEventListener("popstate", e => pintar((e.state && e.state.ruta) || "#/"));
  pintar(ruta);
</script>
