<body>
<div id="app"></div>
<!-- Formulario de suscripción para Netlify Forms (oculto: el visible lo pinta boletin.js) -->
<form name="suscripcion" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="nombre"><input type="email" name="email"><input type="tel" name="movil"><input type="checkbox" name="privacidad">
</form>
<script src="boletines.js"></script>
<script src="legales.js"></script>
<script src="boletin.js"></script>
<script>
  /* Navegación sin cambiar la dirección: la barra muestra siempre solo la dirección del boletín.
     Los enlaces que llegan con #/... (por ejemplo, el de un colaborador) se abren y la dirección se limpia. */
  const CFG = window.PATRIAM_CONFIG || {};
  const TITULOS = { noticias: "Noticias", historia: "Historia", analisis: "Análisis", editoriales: "Editorial", editorial: "Editorial", colaboraciones: "Colaboraciones", colaboracion: "Colaboraciones", iniciativas: "Iniciativas", boletines: "Boletines anteriores", buscar: "Buscar", legal: "Textos legales", suscribirse: "Suscríbete", al: "Al momento" };
  const LIMPIA = location.pathname;
  let ruta = "#/";

  const viejo = new URLSearchParams(location.search).get("n");
  if (viejo) ruta = "#/boletin/" + encodeURIComponent(viejo);
  else if (location.hash.startsWith("#/")) ruta = location.hash;
  history.replaceState({ ruta }, "", LIMPIA);

  function pintar(r, arriba) {
    ruta = r || "#/";
    document.getElementById("app").innerHTML = renderApp(ruta, (window.BOLETINES || []).filter(b => !b.estado || b.estado === "aprobado"), CFG);
    if (navigator.share) document.querySelectorAll(".bol-mas").forEach(b => b.hidden = false);  // en el móvil: compartir en Instagram y otras apps
    const sec = ruta.slice(2).split("/")[0];
    document.title = (CFG.cabecera || "Lo que hay que saber") + (TITULOS[sec] ? " · " + TITULOS[sec] : " · Boletín de PATRIAM");
    const caja = document.querySelector(".bol-buscar input");
    if (caja && sec === "buscar") caja.value = decodeURIComponent(ruta.split("/")[2] || "");
    if (arriba !== false) {
      const c = document.getElementById("centro"), menu = document.querySelector(".bol-menu");
      const y = ruta === "#/" || !c ? 0 : Math.max(0, c.getBoundingClientRect().top + window.scrollY - (menu ? menu.offsetHeight : 0) - 16);
      window.scrollTo(0, y);
    }
  }
  function ir(r) { if (r === ruta) { window.scrollTo({ top: 0, behavior: "smooth" }); return; } history.pushState({ ruta: r }, "", LIMPIA); pintar(r); }

  // Lo que se abre va a una pestaña nueva, con «Volver al boletín semanal» arriba y abajo.
  // «Boletín semanal» y «Volver al boletín» vuelven a la portada en la misma pestaña.
  function abrirNueva(destino) {
    const a = document.createElement("a");
    a.href = location.href.split("#")[0] + destino; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#/']");
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    const destino = a.getAttribute("href");
    if (destino === "#/") ir("#/"); else abrirNueva(destino);
  });
  window.buscarDesde = input => { const q = input.value.trim(); if (q) { abrirNueva("#/buscar/" + encodeURIComponent(q)); input.value = ""; } return false; };
  // Botón "atrás" del móvil o del navegador
  window.addEventListener("popstate", e => pintar((e.state && e.state.ruta) || "#/"));
  pintar(ruta);
</script>
</body>
