# «España al día»: titulares de política y economía (The Objective, El Debate, La Gaceta, El Español)
# de la última semana, agrupados por noticia. Se actualiza solo tres veces al día.
name: España al día
on:
  schedule:
    - cron: '7 5 * * *'
    - cron: '7 11 * * *'
    - cron: '7 17 * * *'
  workflow_dispatch:
  push:
    paths: ["scripts/espana-al-dia.mjs", ".github/workflows/espana-al-dia.yml"]
permissions:
  contents: write
concurrency: { group: espana-al-dia, cancel-in-progress: false }
jobs:
  recopilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/espana-al-dia.mjs
      - name: Guardar
        run: |
          git config user.name "patriamnews"
          git config user.email "patriamnews@users.noreply.github.com"
          git add datos/espana-al-dia.json web/espana-al-dia.js
          git diff --cached --quiet && exit 0
          git commit -m "España al día: actualización automática"
          git pull --rebase -q origin main && git push
